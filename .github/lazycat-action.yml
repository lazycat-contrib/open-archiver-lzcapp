version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: open-archiver
build:
  toolchains: []
  run_buildscript: false
images:
  - id: open-archiver
    target: service
    service: open-archiver
    source: logiclabshq/open-archiver
    channel: custom
    sort: semver
    tag_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: postgres
    target: service
    service: postgres
    source: library/postgres
    channel: custom
    sort: semver
    # postgres publishes two-part tags (17.11); pad to three (koillection precedent)
    tag_regex: '^17[.][0-9]+$'
    version_regex: '^(?P<version>17[.][0-9]+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: valkey
    target: service
    service: valkey
    source: valkey/valkey
    channel: custom
    sort: semver
    tag_regex: ^8[.][0-9]+[.][0-9]+$
    version_regex: ^(?P<version>8[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: meilisearch
    target: service
    service: meilisearch
    source: getmeili/meilisearch
    channel: custom
    sort: semver
    tag_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: tika
    target: service
    service: tika
    source: apache/tika
    channel: custom
    sort: semver
    tag_regex: ^4[.][0-9]+[.][0-9]+-full$
    version_regex: ^(?P<version>4[.][0-9]+[.][0-9]+)-full$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
